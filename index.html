<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Speedtest</title>
  <meta name="description" content="Kleiner Internet-Speedtest mit Tacho">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="ptr" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <main>
    <header>
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="30" height="30">
        <h1>Speedtest</h1>
        <span id="conn" class="conn" hidden></span>
      </div>
      <div class="tools">
        <button id="openHistory" class="icon-btn" type="button" aria-label="Verlauf" title="Verlauf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
        </button>
        <details id="settings">
          <summary class="icon-btn" aria-label="Einstellungen" title="Einstellungen">⚙︎</summary>
          <div class="panel">
            <label>Server
              <select id="server"></select>
            </label>
            <input id="customUrl" type="url" placeholder="https://mein-server.example" hidden>
            <label>Datenlimit
              <select id="limit"></select>
            </label>
            <label>Standort im Verlauf
              <select id="locMode"></select>
            </label>
            <dl class="diag">
              <dt>Verbindung</dt><dd id="diagConn">–</dd>
              <dt>Anbieter-Info</dt><dd id="diagMeta">–</dd>
              <dt>Standort</dt><dd id="diagLoc">noch nicht abgefragt</dd>
              <dt>Upload-Messung</dt><dd id="diagUpload">noch kein Test</dd>
              <dt>Version</dt><dd id="diagVersion">–</dd>
            </dl>
          </div>
        </details>
      </div>
    </header>

    <div id="gauge"></div>

    <div id="spark" class="spark"></div>

    <section class="results">
      <div class="res" data-k="down"><span class="lbl">↓ Download</span><span class="val" id="down">–</span><span class="unit">Mbit/s</span></div>
      <div class="res" data-k="up"><span class="lbl">↑ Upload</span><span class="val" id="up">–</span><span class="unit">Mbit/s</span></div>
      <div class="res" data-k="ping"><span class="lbl">Ping</span><span class="val" id="ping">–</span><span class="unit">ms</span></div>
      <div class="res" data-k="jitter"><span class="lbl">Jitter</span><span class="val" id="jitter">–</span><span class="unit">ms</span></div>
    </section>

    <div class="actions">
      <button id="cancel" type="button">Abbrechen</button>
      <p id="error" role="alert" hidden></p>
    </div>

    <footer>
      <span id="meta">Server: Cloudflare</span> · <span id="used">0</span> MB verbraucht
    </footer>
  </main>

  <section id="history" class="sheet" role="dialog" aria-label="Verlauf" hidden>
    <div class="sheet-head">
      <h2>Verlauf</h2>
      <button class="sheet-close icon-btn" type="button" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body"></div>
  </section>
  <script type="module" src="js/app.js"></script>
</body>
</html>
